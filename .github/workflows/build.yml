name: Build & Test

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      
      # Setup dotnet
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      
      # Tool Restore
      - name: Tool Restore
        run: dotnet tool restore
        working-directory: ./
      
      # Build
      - name: Build
        run: dotnet build --configuration Release
        working-directory: ./
      
      # Test
      - name: Run unit tests
        run: dotnet test --configuration Release
        working-directory: ./

  bun:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Tool Restore
        run: dotnet tool restore

      - name: Install
        run: bun install --frozen-lockfile
        working-directory: ./src/Haya.Bun

      # Fable -> TypeScript, type-check, compile single binary
      - name: Build
        run: bun run build
        working-directory: ./src/Haya.Bun

      - name: Smoke test
        run: ./dist/haya --help
        working-directory: ./src/Haya.Bun

  # The html explorer is bundled into the committed src/Haya.Core/ViewerAssets.fs. Fail if it no longer matches
  # src/Haya.Viewer. Bun is pinned because the minified bundle can differ between Bun versions: when bumping it,
  # run `bun run gen` in src/Haya.Viewer with that version and commit the result with the bump.
  viewer:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile
        working-directory: ./src/Haya.Viewer

      - name: Check ViewerAssets.fs is up to date
        run: bun run check
        working-directory: ./src/Haya.Viewer
