<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:">
<title>@@HAYA_TITLE@@</title>
<style>
@@HAYA_CSS@@
</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <div id="bar-main">
      <strong id="title"></strong>
      <div id="search-wrap">
        <input id="search" type="search" placeholder="Search apps and systems" aria-label="Search apps and systems" autocomplete="off">
        <ul id="results" hidden></ul>
      </div>
      <div id="bar-actions">
        <button id="fit" type="button">Fit</button>
        <button id="reset" type="button">Reset</button>
        <button id="theme" type="button" title="Switch between automatic, light and dark"></button>
      </div>
    </div>
    <div id="filters" role="group" aria-label="Filters"></div>
  </header>
  <main id="main">
    <div id="graph" role="application" aria-label="System graph"></div>
    <details id="legend" open><summary>Legend</summary><ul id="legend-list"></ul></details>
    <aside id="panel" aria-live="polite"></aside>
  </main>
</div>
<script type="application/json" id="haya-data">@@HAYA_DATA@@</script>
<script>
@@HAYA_JS@@
</script>
</body>
</html>
